<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Mossy Launcher</title>
    <style>
      body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; }
      button { margin: 5px; padding: 8px 16px; }
      input { margin: 5px; padding: 8px; width: 300px; }
      #log { background: #f0f0f0; padding: 10px; height: 300px; overflow-y: auto; font-family: monospace; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Mossy Launcher — Desktop (prototype)</h1>
    
    <div>
      <input type="text" id="token" placeholder="API Token">
      <button id="save-token">Save Token</button>
      <button id="load-token">Load Token</button>
    </div>
    
    <div>
      <input type="text" id="api-url" placeholder="API Base URL" value="https://api.example.com">
      <button id="consent">Request Consent</button>
    </div>
    
    <h3>Output</h3>
    <pre id="log"></pre>

    <div>
      <button id="get-active">Get Active Window</button>
      <button id="start-voice">Start Voice Recognition</button>
      <button id="speak">Speak (TTS)</button>
      <button id="export">Export Logs</button>
    </div>
    
    <script src="index.js"></script>
  </body>
</html>
